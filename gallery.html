<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ty's Food Spot - Gallery</title>
  <link rel="stylesheet" href="style.css?v=20260831">
  <link rel="stylesheet" href="gallery.css?v=20260831">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css?v=20260831">
</head>
<body>
  <header class="main-header">
    <button class="menu-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
    <div class="logo">
      <div class="logo-text">Ty's</div>
      <div class="logo-sub">GALLERY</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="location.href='cart.html'">
        <i class="fas fa-shopping-bag"></i>
        <span class="badge cart-badge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <div class="section-header">
    <h2 class="section-title">Our Delicious Gallery</h2>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
    <a href="menu.html" class="nav-item"><i class="fas fa-utensils"></i>Menu</a>
    <a href="gallery.html" class="nav-item active"><i class="fas fa-images"></i>Gallery</a>
    <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i>Cart</a>
    <a href="contact.html" class="nav-item"><i class="fas fa-envelope"></i>Contact</a>
  </nav>

  <script type="module" src="main.js?v=20260831"></script>
  <script type="module" src="gallery.js?v=20260831"></script>
</body>
</html>
