<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ty's Food Spot - Cart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="main-header">
    <button class="menu-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
    <div class="logo">
      <div class="logo-text">Ty's</div>
      <div class="logo-sub">CART</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="clearCart(); renderCart();" title="Clear Cart"><i class="fas fa-trash-alt"></i></button>
    </div>
  </header>

  <div id="cartContent">
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-summary" id="cartSummary">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">N0</span></div>
      <div class="summary-row"><span>Delivery Fee</span><span>N500</span></div>
      <div class="summary-row total"><span>Total</span><span id="total">N0</span></div>
      <button class="checkout-btn" onclick="checkout()"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>
    </div>
  </div>

  <div class="empty-cart" id="emptyCart" style="display:none">
    <i class="fas fa-shopping-basket"></i>
    <h2>Your cart is empty</h2>
    <p>Browse our menu and add some delicious meals!</p>
    <a href="menu.html" class="browse-btn">Browse Menu</a>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
    <a href="menu.html" class="nav-item"><i class="fas fa-utensils"></i>Menu</a>
    <a href="gallery.html" class="nav-item"><i class="fas fa-images"></i>Gallery</a>
    <a href="cart.html" class="nav-item active"><i class="fas fa-shopping-cart"></i>Cart</a>
    <a href="contact.html" class="nav-item"><i class="fas fa-envelope"></i>Contact</a>
  </nav>

  <script type="module" src="main.js"></script>
  <script type="module" src="cart.js"></script>
</body>
</html>
