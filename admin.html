<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ty's Food Spot - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="main-header">
    <button class="menu-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
    <div class="logo">
      <div class="logo-text">Ty's</div>
      <div class="logo-sub">ADMIN</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="location.href='cart.html'">
        <i class="fas fa-shopping-bag"></i>
        <span class="badge cart-badge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <div class="admin-stats">
    <div class="stat-card">
      <i class="fas fa-utensils"></i>
      <div><h3 id="statMeals">0</h3><p>Total Meals</p></div>
    </div>
    <div class="stat-card">
      <i class="fas fa-star"></i>
      <div><h3 id="statPopular">0</h3><p>Popular</p></div>
    </div>
    <div class="stat-card">
      <i class="fas fa-shopping-cart"></i>
      <div><h3 id="statCart">0</h3><p>Cart Items</p></div>
    </div>
  </div>

  <div class="admin-section">
    <h2 class="section-title"><i class="fas fa-plus-circle"></i> Add New Meal</h2>
    <form class="admin-form" onsubmit="handleAddMeal(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Meal Name *</label>
          <input type="text" id="mName" placeholder="e.g. Party Jollof Rice" required>
        </div>
        <div class="form-group">
          <label>Price (N) *</label>
          <input type="number" id="mPrice" placeholder="4500" required>
        </div>
      </div>
      <div class="form-group">
        <label>Description *</label>
        <input type="text" id="mDesc" placeholder="Short description of the meal" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category *</label>
          <select id="mCategory" required>
            <option value="rice">Rice Dishes</option>
            <option value="pasta">Pasta</option>
            <option value="grills">Grills</option>
            <option value="soups">Soups</option>
            <option value="drinks">Drinks</option>
          </select>
        </div>
        <div class="form-group">
          <label>Rating (1-5)</label>
          <input type="number" id="mRating" min="1" max="5" step="0.1" value="4.5" required>
        </div>
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="mImage" placeholder="https://example.com/image.jpg">
        <small style="color:var(--text-muted);font-size:11px">Leave empty for a default food image</small>
      </div>
      <div class="form-check">
        <input type="checkbox" id="mPopular">
        <label for="mPopular">Mark as Popular</label>
      </div>
      <button type="submit" class="submit-btn"><i class="fas fa-plus"></i> Add Meal</button>
    </form>
  </div>

  <div class="admin-section">
    <div class="section-header" style="padding:0;margin-bottom:14px">
      <h2 class="section-title"><i class="fas fa-list"></i> Manage Meals</h2>
      <button class="reset-btn" onclick="resetMeals()"><i class="fas fa-undo"></i> Reset Default</button>
    </div>
    <div class="admin-meals-list" id="adminMealsList"></div>
  </div>

  <div class="admin-section">
    <h2 class="section-title"><i class="fas fa-inbox"></i> Contact Inquiries</h2>
    <div class="inquiries-list" id="inquiriesList"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
    <a href="menu.html" class="nav-item"><i class="fas fa-utensils"></i>Menu</a>
    <a href="gallery.html" class="nav-item"><i class="fas fa-images"></i>Gallery</a>
    <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i>Cart</a>
    <a href="contact.html" class="nav-item"><i class="fas fa-envelope"></i>Contact</a>
  </nav>

  <script src="main.js"></script>
  <script src="admin.js"></script>
</body>
</html>
